<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Product | RIVO STORE</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="site-header">

        <a href="index.html" class="brand">

            <img src="images/logo.jpeg"
                alt="RIVO STORE">

        </a>

        <nav class="main-nav">

            <a href="index.html"
                data-i18n="navHome">

                HOME

            </a>

            <a href="index.html#shop"
                data-i18n="navShop">

                SHOP

            </a>

        </nav>

        <div class="header-actions">

            <div class="language-switcher">

                <button
                    type="button"
                    data-language="en"
                    class="active">

                    EN

                </button>

                <span>/</span>

                <button
                    type="button"
                    data-language="ar">

                    AR

                </button>

            </div>

            <a href="index.html#shop"
                class="button button-dark header-cta"
                data-i18n="backToShop">

                BACK TO SHOP

            </a>

        </div>

    </header>


    <!-- PRODUCT PAGE -->

    <main class="product-main section-wrap">

        <a href="index.html#shop"
            class="back-link"
            data-i18n="backCollection">

            ← BACK TO COLLECTION

        </a>


        <!-- JavaScript loads product details here -->

        <div id="productDetail"
            class="product-detail">

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <a href="index.html" class="footer-logo">
            RIVO<sup>®</sup>
        </a>

        <p data-i18n="footerTagline">
            PREMIUM STREETWEAR FOR EVERYONE.
        </p>

        <small>

            © <span id="year"></span> RIVO STORE

        </small>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/products.js"></script>

    <script src="js/app.js"></script>

    <script src="js/checkout.js"></script>

</body>

</html>
